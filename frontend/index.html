<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Brisas Marinas</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body class="login-body">

    <div class="login-container">
        <!-- Lado izquierdo: ilustración + marca -->
        <div class="login-illustration">
            <div class="login-brand">
                <div class="login-brand-icon"><img src="/assets/img/logo.png" alt="Brisas Marinas"></div>
                <div class="login-brand-name">Brisas Marinas</div>
            </div>

        </div>

        <!-- Lado derecho: formulario -->
        <div class="login-form-wrapper">
            <h1 class="login-form-title">Bienvenido</h1>
            <p class="login-form-subtitle">Ingresa tus credenciales para continuar</p>

            <div id="login-error" class="login-error hidden"></div>

            <form id="login-form" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <input
                        class="form-input"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="admin"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
                    Iniciar sesión
                </button>
            </form>

            <div class="login-footer">
                © 2026 Restaurante Brisas Marinas — Moñitos, Córdoba
            </div>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script>
        const form  = document.getElementById('login-form');
        const error = document.getElementById('login-error');
        const btn   = document.getElementById('btn-login');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            error.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = 'Ingresando...';

            try {
                const res = await api.post('/auth/login', { username, password });
                api.setToken(res.data.token);
                api.setUser(res.data.user);
                window.location.href = '/pages/dashboard.html';
            } catch (err) {
                error.textContent = err.message || 'Error al iniciar sesión.';
                error.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
